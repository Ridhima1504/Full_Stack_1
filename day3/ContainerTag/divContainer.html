<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a {
            background-color: blueviolet;
            width: 250px;
        }

        .b {
            background-color: orange;
        }

        .c {
            background-color: blueviolet;
        }

        .d {
            background-color: orange;
        }
    </style>
</head>
<body>
    <!-- DIV Container is also know as Block Level Element(Tag) It Takes 100% width -->

    <div class="a">
        <h2>Books</h2>
        <p>This is a Box of Books</p>
        <button>Buy Now</button>
    </div>

    <div class="b">
        <h2>Fruits</h2>
        <p>This is a Box of Fruits</p>
        <p>Add to Cart</p>
    </div>

    <!-- Span Tag - It Will Only Tak required amount of width size as per content -->

    <p>Good evening, how are you?</p>

    <p>Good <span class="c">Morning</span>, Howdy? </p>

    <button>Cart 0</button>

    <button>Cart <span class="d">0</span></button>
</body>
</html>
